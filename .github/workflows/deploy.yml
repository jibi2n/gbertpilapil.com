# Every push to main is tested, built and deployed to gbertpilapil.com.
# Pull requests get the same tests and build as a check, but never deploy.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # A "Run workflow" button in the Actions tab, for redeploying by hand.

# One deploy at a time; a newer push waits instead of racing the older one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Runs the real migrations and seed against a throwaway in-memory database; needs no Cloudflare access.
      - run: npm test
      # Type-checks (astro check) and builds.
      - run: npm run build

  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://gbertpilapil.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Schema first, so the new code never runs against an old database. Does nothing when none are pending.
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy
        run: npm run deploy
